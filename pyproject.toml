[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warmpool"
version = "1.0.0"
description = "Mining 150 years of El Nino history for US electricity demand and price risk"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adwitiya Shukla" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5", "statsmodels>=0.14", "mlxtend>=0.23", "xlwt>=1.3"]

[project.scripts]
warmpool = "warmpool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
